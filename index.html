<footer style="background:var(--d);color:#cbd5e1;padding:18px 20px;text-align:center;font-size:.85em;margin-top:30px"><b style="color:var(--o)">DEPANNE31</b> · Toulouse et agglomération · 07 82 18 63 13 · <a href="#" onclick="go('legal-mentions');return false">Mentions légales</a> · <a href="#" onclick="go('legal-cgu');return false">CGU</a> · <a href="#" onclick="go('legal-cgv');return false">CGV</a> · <a href="#" onclick="go('legal-rgpd');return false">Confidentialité (RGPD)</a> · <a href="#" onclick="go('legal-cookies');return false">Cookies</a> · <a href="#" onclick="LS.s('d31db','');DB=null;load();go('home');return false">Réinitialiser la démo</a></footer>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let T='',U=null,SV=[],NIGHT=false,view='home';
const mem={},LS={g:k=>{try{return localStorage.getItem(k)}catch{return mem[k]??null}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch{mem[k]=v}}},store={get t(){return LS.g('t')},set t(v){LS.s('t',v)}};
const hash=s=>btoa(unescape(encodeURIComponent(s+'d31'))),night=()=>{const h=+new Intl.DateTimeFormat('fr-FR',{hour:'numeric',hourCycle:'h23',timeZone:'Europe/Paris'}).format(new Date());return h>=20||h<8};
let DB=null;const save=()=>LS.s('d31db',JSON.stringify(DB));
function load(){try{DB=JSON.parse(LS.g('d31db'))}catch{DB=null}if(DB&&DB.services)return;
DB={seq:3,iseq:0,reviews:{},notifs:[],interventions:[],services:[['','Ouverture de porte','Porte claquée ou serrure bloquée','Serrurerie','urgence',120,200],['','Urgence plomberie','Fuite, dégât des eaux, canalisation bouchée','Plomberie','urgence',180,300],['','Urgence électricité','Panne, court-circuit, disjoncteur HS','Électricité','urgence',180,300],['','Panne chauffage','Chaudière ou radiateur en panne','Chauffage','urgence',200,280],['','Débouchage urgent','WC, évier, baignoire bouchés','Plomberie','urgence',150,220],['','Changement de serrure','Remplacement complet, toutes marques','Serrurerie','courante',160,160],['','Réparation fuite d’eau','Recherche et réparation, joints, robinetterie','Plomberie','courante',130,130],['','Prise / interrupteur','Pose ou remplacement avec diagnostic','Électricité','courante',90,90],['','Entretien chaudière','Nettoyage, contrôle, réglages complets','Chauffage','courante',120,120]].map((s,i)=>({id:i+1,icon:s[0],label:s[1],descr:s[2],trade:s[3],kind:s[4],price_day:s[5],price_night:s[6]})),
users:[{id:1,name:'Admin',email:'admin@depanne31.fr',role:'admin'},{id:2,name:'Marc Technicien',email:'tech@depanne31.fr',role:'technicien'},{id:3,name:'Julie Cliente',email:'client@depanne31.fr',role:'client'}].map(u=>({...u,hash:hash('demo1234'),available:u.role=='technicien'?1:0,approved:1}))};save()}
const N=(uid,msg)=>DB.notifs.unshift({id:Math.random(),user_id:uid,msg,seen:0});
const J=i=>{const s=DB.services.find(x=>x.id==i.service_id),c=DB.users.find(x=>x.id==i.client_id),t=DB.users.find(x=>x.id==i.tech_id),r=DB.reviews[i.id]||{};return{...i,label:s.label,icon:s.icon,cname:c.name,cphone:c.phone,tname:t&&t.name,tphone:t&&t.phone,rating:r.rating,comment:r.comment}};
const safe=u=>({id:u.id,name:u.name,email:u.email,phone:u.phone,role:u.role,available:u.available,approved:u.approved});
async function api(p,m='GET',b={}){load();const E=s=>{throw s},u=T&&DB.users.find(x=>'u'+x.id==T),R=u&&u.role,[a,id,act]=p.split('/'),need=(...r)=>{if(!u)E('Connexion requise');if(r.length&&!r.includes(R))E('Accès refusé')};
let out={ok:true};
if(a=='register'){if(!b.name||!b.email||!b.password||b.password.length<6)E('Nom, email et mot de passe (6 car. min) requis');if(!['client','technicien'].includes(b.role))E('Rôle invalide');if(DB.users.some(x=>x.email==b.email))E('Email déjà utilisé');DB.users.push({id:++DB.seq,name:b.name,email:b.email,phone:b.phone,hash:hash(b.password),role:b.role,available:0,approved:b.role=='client'?1:0});if(b.role=='technicien')DB.users.filter(x=>x.role=='admin').forEach(x=>N(x.id,`Nouveau technicien à valider : ${b.name}`))}
else if(a=='login'){const x=DB.users.find(x=>x.email==b.email&&x.hash==hash(b.password||''));if(!x)E('Identifiants incorrects');out={token:'u'+x.id}}
else if(a=='me'){need();if(id=='available'){u.available=b.available?1:0}else out=safe(u)}
else if(a=='services'){if(m=='PUT'){need('technicien','admin');const d=+b.price_day,n=+b.price_night;if(!(d>0)||!(n>0))E('Prix invalide');Object.assign(DB.services.find(x=>x.id==id),{price_day:d,price_night:n})}else out={night:night(),list:DB.services}}
else if(a=='users'){need('admin');if(m=='PUT'){const x=DB.users.find(x=>x.id==id);if(x&&x.role!='admin')x.approved=b.approved?1:0}else out=DB.users.map(x=>{const rs=DB.interventions.filter(i=>i.tech_id==x.id&&DB.reviews[i.id]).map(i=>DB.reviews[i.id].rating);return{...safe(x),note:rs.length?Math.round(rs.reduce((p,c)=>p+c,0)/rs.length*10)/10:null}})}
else if(a=='notifs'){need();if(m=='POST')DB.notifs.forEach(n=>{if(n.user_id==u.id)n.seen=1});else out=DB.notifs.filter(n=>n.user_id==u.id).slice(0,15)}
else if(a=='interventions'&&!id){need();if(m=='GET')out=DB.interventions.filter(i=>R=='client'?i.client_id==u.id:R=='technicien'?(i.tech_id==u.id||(i.status=='pending'&&u.available&&u.approved)):1).map(J).reverse();
else{need('client');const sv=DB.services.find(x=>x.id==b.service_id);if(!sv||!b.address||!b.descr)E('Service, adresse et description requis');if(b.photo&&b.photo.length>1.2e6)E('Photo trop lourde (1 Mo max en démo)');if(sv.kind=='courante'&&!b.slot)E('Choisissez un créneau');
const ug=sv.kind=='urgence',period=ug?(night()?'nuit':'jour'):'courante',price=period=='nuit'?sv.price_night:sv.price_day,it={id:++DB.iseq,client_id:u.id,tech_id:null,service_id:sv.id,period,price,address:b.address,descr:b.descr,photo:b.photo||null,slot:b.slot||null,status:'pending',paid_at:null,refunded:0};DB.interventions.push(it);
const ts=DB.users.filter(x=>x.role=='technicien'&&x.available&&x.approved);ts.forEach(x=>N(x.id,`Nouvelle demande : ${sv.label} (${period}, ${price} €)`));out={id:it.id,warning:ts.length?null:'Aucun technicien disponible pour le moment : votre demande reste en attente.'}}}
else if(a=='interventions'){need();const i=DB.interventions.find(x=>x.id==id)||E('Introuvable'),st=i.status,bad=()=>E('Action impossible dans cet état');
if(act=='accept'){need('technicien');if(!u.available||!u.approved)E('Passez en « disponible » (compte validé requis)');if(st!='pending')E('Déjà prise par un autre technicien');i.status='accepted';i.tech_id=u.id;N(i.client_id,`${u.name} a validé votre demande : vous pouvez payer.`)}
else if(act=='pay'){need('client');if(i.client_id!=u.id||st!='accepted')bad();i.status='paid';i.paid_at=new Date().toLocaleString('fr-FR');N(i.tech_id,`Demande #${i.id} payée : vous pouvez intervenir.`)}
else if(act=='start'){need('technicien');if(i.tech_id!=u.id||st!='paid')bad();i.status='in_progress';N(i.client_id,'Votre technicien est en route / a commencé.')}
else if(act=='done'){need('technicien');if(i.tech_id!=u.id||st!='in_progress')bad();i.status='done';N(i.client_id,'Intervention terminée. Laissez un avis !')}
else if(act=='cancel'){const ok=(R=='client'&&i.client_id==u.id&&['pending','accepted','paid'].includes(st))||(R=='technicien'&&i.tech_id==u.id&&['accepted','paid'].includes(st))||(R=='admin'&&!['done','cancelled'].includes(st));if(!ok)E('Annulation impossible');i.refunded=i.paid_at?1:0;i.status='cancelled';const msg=`Demande #${i.id} annulée${i.refunded?` — ${i.price} € remboursés (simulé)`:''}.`;N(i.client_id,msg);if(i.tech_id)N(i.tech_id,msg)}
else if(act=='review'){need('client');const n=+b.rating;if(i.client_id!=u.id||st!='done'||!(n>=1&&n<=5))E('Avis impossible');DB.reviews[i.id]={rating:n,comment:b.comment||''}}}
if(m!='GET')save();return out}
function facture(id){load();const i=DB.interventions.find(x=>x.id==id);if(!i||!i.paid_at||!U||(U.role=='client'&&i.client_id!=U.id))return go('dash');const j=J(i),ht=(i.price/1.2).toFixed(2),tva=(i.price-i.price/1.2).toFixed(2);
$('#app').innerHTML=`<div class="card"><h2 style="margin-top:0">Facture n°${String(i.id).padStart(5,'0')}</h2><p>Date de paiement : ${esc(i.paid_at)}<br>Client : ${esc(j.cname)}<br>Technicien : ${esc(j.tname)}</p><table border="1" style="border-collapse:collapse"><tr><td>${esc(j.label)} (${i.period}) — ${esc(i.address)}</td><td>${ht} € HT</td></tr><tr><td>TVA 20 %</td><td>${tva} €</td></tr><tr><th>Total TTC${i.refunded?' (REMBOURSÉ)':''}</th><th>${i.price} €</th></tr></table><p><button onclick="print()">Imprimer / PDF</button> </p></div>`}
const ST={pending:'En attente d’un technicien',accepted:'Validée — paiement attendu',paid:'Payée',in_progress:'En cours',done:'Terminée',cancelled:'Annulée'};
const go=v=>{view=v;draw()};
async function boot(){T=store.t||'';const r=await api('services');SV=r.list;NIGHT=r.night;try{U=T?await api('me'):null}catch{U=null;T=''}draw()}
function nav(){$('#nav').innerHTML='<button class="s" onclick="go(\'galerie\')">Réalisations</button><button class="s" onclick="go(\'avis\')">Avis</button>'+(U?`<button onclick="go('dash')">Mon espace</button>`:`<button onclick="go('login')">Connexion</button><button class="s" onclick="go('register')">S’inscrire</button>`)}
function draw(){nav();$('#back').innerHTML=view=='home'?'':`<button class="s" onclick="go('${view.startsWith('fact')?'dash':'home'}')">${view.startsWith('fact')?'Retour à mon espace':'Retour à l’accueil'}</button>`;if(view=='home')home();else if(view=='login'||view=='register')authView();else if(view=='dash')U?dash():go('login');else if(view.startsWith('order'))order(+view.slice(5));else if(view.startsWith('legal-'))legal(view.slice(6));else if(view.startsWith('fact'))facture(+view.slice(4));else if(view=='galerie')galerie();else if(view=='avis')avisPage()}
function home(){
const tile=s=>`<div class="card sv" onclick="pick(${s.id})"><b>${s.label}</b><div class="t">${s.descr}</div><div class="p">${s.kind=='urgence'&&NIGHT?s.price_night:s.price_day} € TTC</div></div>`;
$('#app').innerHTML=`<div class="hero"><h1>Dépannage.<br>Simple. Rapide.</h1><p>Toulouse et agglomération · Prix fixes · Paiement sécurisé</p><p>Tarif actuel appliqué automatiquement : <b>${NIGHT?'NUIT (20h–8h)':'JOUR (8h–20h)'}</b></p></div>
<h2>Urgences (jour 8h–20h / nuit 20h–8h)</h2><div class="grid">${SV.filter(s=>s.kind=='urgence').map(tile).join('')}</div>
<h2>Interventions courantes</h2><div class="grid">${SV.filter(s=>s.kind=='courante').map(tile).join('')}</div>
<h2>Nos réalisations, avant / après</h2>${galHtml(3)}${gal().length?'<p><button onclick="go(\'galerie\')">Voir toutes les réalisations</button></p>':''}
<h2>Avis clients</h2>${avHome()}<h2>Partenaires</h2><p>EPC toiture · Portet Locations · OMS</p><p class="t">Un autre besoin ? Appelez-nous : 07 82 18 63 13</p>`}
function pick(id){U?go('order'+id):go('login')}
function authView(){const reg=view=='register';$('#app').innerHTML=`<div class="card box"><h2>${reg?'Inscription':'Connexion'}</h2>${reg?'<input id=n placeholder="Nom"><input id=ph placeholder="Téléphone"><select id=ro><option value=client>Je suis client</option><option value=technicien>Je suis technicien (validation admin)</option></select>':''}<input id=e type=email placeholder="Email"><input id=pw type=password placeholder="Mot de passe"><button onclick="auth(${reg})">${reg?'Créer mon compte':'Se connecter'}</button><p class="t">Démo : client@depanne31.fr / tech@depanne31.fr / admin@depanne31.fr — mot de passe demo1234</p></div>`}
async function auth(reg){try{if(reg){await api('register','POST',{name:$('#n').value,phone:$('#ph').value,role:$('#ro').value,email:$('#e').value,password:$('#pw').value});alert('Compte créé'+($('#ro').value=='technicien'?' — en attente de validation par un admin':''))}
const r=await api('login','POST',{email:$('#e').value,password:$('#pw').value});T=r.token;store.t=T;U=await api('me');if(U.role!='client')await sbSignIn($('#e').value.trim(),$('#pw').value).catch(()=>{});await loadAv();go('dash')}catch(e){alert(e)}}
function order(id){const s=SV.find(x=>x.id==id),u=s.kind=='urgence',price=u&&NIGHT?s.price_night:s.price_day;
$('#app').innerHTML=`<div class="card box"><h2>${s.label}</h2><p class="p">${price} € TTC ${u?(NIGHT?'(tarif nuit)':'(tarif jour)'):''}</p><input id=ad placeholder="Adresse d’intervention (Toulouse et agglo)"><textarea id=de rows=3 placeholder="Décrivez le problème"></textarea><label class="t">Photo (facultatif)</label><input id=ph type=file accept="image/*">${u?'<p class="t">Urgence : un technicien disponible peut valider votre demande, puis vous payez.</p>':'<label class="t">Créneau souhaité</label><input id=sl type=datetime-local>'}<button onclick="send(${id})">Envoyer la demande</button></div>`}
async function send(id){try{let photo=null;const f=$('#ph').files[0];if(f)photo=await new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)});
const r=await api('interventions','POST',{service_id:id,address:$('#ad').value,descr:$('#de').value,photo,slot:$('#sl')?.value});if(r.warning)alert(r.warning);go('dash')}catch(e){alert(e)}}
const act=async(id,a)=>{try{await api(`interventions/${id}/${a}`,'POST');dash()}catch(e){alert(e);dash()}};
const rev=async id=>{try{await api(`interventions/${id}/review`,'POST',{rating:+$('#r'+id).value,comment:$('#c'+id).value});const c=$('#c'+id).value.trim();if(c.length>=5)fetch(`${SBU}/rest/v1/avis`,{method:'POST',headers:sbH(null,{'content-type':'application/json',Prefer:'return=minimal'}),body:JSON.stringify({name:U.name.split(' ')[0],rating:+$('#r'+id).value,comment:c})}).catch(()=>{});dash()}catch(e){alert(e)}};
function card(i){const R=U.role,st=i.status;let b='';
if(R=='client'){if(st=='accepted')b+=`<button onclick="act(${i.id},'pay')">Payer ${i.price} € (simulé)</button>`;if(['pending','accepted','paid'].includes(st))b+=`<button class="r" onclick="confirm('Annuler ?')&&act(${i.id},'cancel')">Annuler</button>`;if(st=='done'&&!i.rating)b+=`<br><select id=r${i.id} style="width:auto">${[5,4,3,2,1].map(n=>`<option>${n}</option>`).join('')}</select> sur 5 <input id=c${i.id} placeholder="Avis" style="width:60%"><button onclick="rev(${i.id})">Noter</button>`}
if(R=='technicien'){if(st=='pending')b+=`<button onclick="act(${i.id},'accept')">Valider</button>`;if(st=='paid')b+=`<button onclick="act(${i.id},'start')">Démarrer</button>`;if(st=='in_progress')b+=`<button onclick="act(${i.id},'done')">Terminer</button>`;if(['accepted','paid'].includes(st))b+=`<button class="r" onclick="confirm('Annuler ?')&&act(${i.id},'cancel')">Annuler</button>`}
if(R=='admin'&&!['done','cancelled'].includes(st))b+=`<button class="r" onclick="act(${i.id},'cancel')">Annuler</button>`;
if(['paid','in_progress','done'].includes(st)||i.refunded)b+=`<button class="s" onclick="go('fact${i.id}')">Facture</button>`;

async function dash(){if(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&$('#app').contains(document.activeElement))return;
try{const[list,nf]=await Promise.all([api('interventions'),api('notifs')]);U=await api('me');const R=U.role,un=nf.filter(n=>!n.seen);
let h=`<h2>Bonjour ${esc(U.name)} <span class="badge">${R}</span></h2>`;
if(R=='technicien')h+=U.approved?`<label><input type=checkbox style="width:auto" ${U.available?'checked':''} onchange="api('me/available','PUT',{available:this.checked}).then(dash)"> Je suis disponible (reçoit les nouvelles demandes)</label>`:'<p>Compte en attente de validation par un admin.</p>';
if(un.length)h+=`<div class="card"><b>Notifications</b><br>${un.map(n=>esc(n.msg)).join('<br>')}<br><button class="s" onclick="api('notifs/seen','POST').then(dash)">Tout marquer lu</button></div>`;
if(R=='client')h+=`<p><button onclick="go('home')">+ Nouvelle intervention</button></p>`;
h+=`<h2>${R=='client'?'Mes interventions':R=='technicien'?'Demandes & interventions':'Toutes les interventions'}</h2><div class="grid">${list.map(card).join('')||'<p>Rien pour le moment.</p>'}</div>`;
if(R!='client')h+=`<h2>Ajouter une réalisation</h2>${sbSess()?`<div class="card box" style="margin:0"><p class="t">Connecté : ${esc(sbSess().email)}</p><input id=gt placeholder="Titre (ex. Changement de serrure)"><input id=gc placeholder="Ville (ex. Balma)"><select id=gk>${['Serrurerie','Plomberie','Électricité','Chauffage'].map(x=>`<option>${x}</option>`).join('')}</select><label class="t">Photo avant</label><input id=gb type=file accept="image/*"><label class="t">Photo après</label><input id=ga type=file accept="image/*"><button onclick="addReal()">Publier</button></div>`:`<div class="card box" style="margin:0"><p class="t">Votre compte du site n’est pas relié à un compte galerie. Connectez-vous avec votre compte galerie pour publier des photos.</p><input id=se type=email placeholder="Email du compte galerie"><input id=sp type=password placeholder="Mot de passe"><button onclick="sbLogin()">Se connecter</button></div>`}<h2>Galerie publiée</h2>${galHtml()}${sbSess()?`<h2>Avis clients</h2><div class="grid">${AV.map(a=>avCard(a,true)).join('')||'<p>Aucun avis.</p>'}</div>`:''}`;
if(R!='client')h+=`<h2>Tarifs</h2><div class="card"><table><tr><th></th><th>Jour €</th><th>Nuit €</th></tr>${SV.map(s=>`<tr><td>${s.label}</td><td><input id=d${s.id} type=number value=${s.price_day} onchange="pr(${s.id})"></td><td><input id=n${s.id} type=number value=${s.price_night} ${s.kind=='courante'?'disabled':''} onchange="pr(${s.id})"></td></tr>`).join('')}</table></div>`;
if(R=='admin'){const us=await api('users');h+=`<h2>Utilisateurs</h2><div class="card"><table>${us.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${u.role}${u.note?' · note '+u.note:''}</td><td>${u.role!='admin'?`<button class="${u.approved?'r':''}" onclick="api('users/${u.id}/approve','PUT',{approved:${u.approved?0:1}}).then(dash)">${u.approved?'Suspendre':'Valider'}</button>`:''}</td></tr>`).join('')}</table></div>`}
h+=`<p style="margin-top:40px"><a href="#" class="t" onclick="if(confirm('Se déconnecter ?')){T='';store.t='';LS.s('sbs','');U=null;go('home')}return false">Se déconnecter</a></p>`;$('#app').innerHTML=h}catch(e){T='';store.t='';U=null;go('login')}}
async function pr(id){const s=SV.find(x=>x.id==id),d=+$('#d'+id).value,n=s.kind=='courante'?d:+$('#n'+id).value;try{await api('services/'+id,'PUT',{price_day:d,price_night:n});s.price_day=d;s.price_night=n}catch(e){alert(e)}}
const ico=t=>`<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${({Serrurerie:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3M14 9l2 2"/>',Plomberie:'<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',Électricité:'<path d="M13 2L5 14h6l-1 8 8-12h-6z"/>',Chauffage:'<path d="M12 22c4 0 7-2.7 7-7 0-3-2-5-3-7-1 2-2 3-3 3 0-3-1-5-3-7-1 4-5 6-5 11 0 4.3 3 7 7 7z"/>'})[t]||''}</svg>`;
const SBU='https://covykkvxqxzjipmelzll.supabase.co',SBK='sb_publishable_8cuffG9-dCItsOzvqSfQjg_HcFAmqy0';
const pub=p=>`${SBU}/storage/v1/object/public/realisations/${p}`;

const sbH=(t,x)=>({apikey:SBK,Authorization:'Bearer '+(t||SBK),...x});
async function loadGal(){try{const r=await fetch(`${SBU}/rest/v1/realisations?select=*&order=created_at.desc`,{headers:sbH()});GAL=r.ok?(await r.json()).map(x=>({id:x.id,title:x.title,city:x.city,trade:x.trade,bp:x.before_path,ap:x.after_path,before:pub(x.before_path),after:pub(x.after_path)})):[]}catch{GAL=[]}}
async function sbSignIn(email,pw){const r=await fetch(`${SBU}/auth/v1/token?grant_type=password`,{method:'POST',headers:sbH(null,{'content-type':'application/json'}),body:JSON.stringify({email,password:pw})}),j=await r.json();if(!r.ok)throw 'Email ou mot de passe incorrect';LS.s('sbs',JSON.stringify({t:j.access_token,r:j.refresh_token,exp:Date.now()+(j.expires_in-60)*1000,email:j.user.email}))}
async function sbLogin(){try{await sbSignIn($('#se').value.trim(),$('#sp').value);await loadAv();dash()}catch(e){alert(e)}}
let RF=null;async function sbRefresh(){try{const s=JSON.parse(LS.g('sbs'));if(!s||!s.r||s.exp>Date.now())return;const r=await fetch(`${SBU}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:sbH(null,{'content-type':'application/json'}),body:JSON.stringify({refresh_token:s.r})}),j=await r.json();if(!r.ok)throw 0;LS.s('sbs',JSON.stringify({t:j.access_token,r:j.refresh_token,exp:Date.now()+(j.expires_in-60)*1000,email:s.email}))}catch{LS.s('sbs','')}}
const sbEnsure=()=>RF||(RF=sbRefresh().finally(()=>{RF=null}));
const sbLogout=()=>{LS.s('sbs','');dash()};
const shrink=f=>new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,800/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.72))};im.onerror=()=>ko('Image illisible');im.src=r.result};r.onerror=()=>ko('Lecture impossible');r.readAsDataURL(f)});

async function addReal(){try{await sbEnsure();const s=sbSess();if(!s)throw 'Connectez-vous d’abord au compte galerie';const t=$('#gt').value.trim(),b=$('#gb').files[0],a=$('#ga').files[0];if(!t||!b||!a)throw 'Titre, photo avant et photo après requis';const id=Date.now(),bp=id+'-avant.jpg',ap=id+'-apres.jpg';
for(const[p,f]of[[bp,b],[ap,a]]){const blob=await(await fetch(await shrink(f))).blob();const r=await fetch(`${SBU}/storage/v1/object/realisations/${p}`,{method:'POST',headers:sbH(s.t,{'content-type':'image/jpeg'}),body:blob});if(!r.ok)throw 'Envoi de la photo refusé ('+r.status+')'}
const r=await fetch(`${SBU}/rest/v1/realisations`,{method:'POST',headers:sbH(s.t,{'content-type':'application/json',Prefer:'return=minimal'}),body:JSON.stringify({title:t,city:$('#gc').value.trim(),trade:$('#gk').value,before_path:bp,after_path:ap})});if(!r.ok)throw 'Enregistrement refusé ('+r.status+')';await loadGal();dash()}catch(e){alert(e)}}

async function delReal(id){await sbEnsure();const s=sbSess(),x=GAL.find(g=>g.id==id);if(!s||!x||!confirm('Supprimer cette réalisation ?'))return;try{await fetch(`${SBU}/rest/v1/realisations?id=eq.${id}`,{method:'DELETE',headers:sbH(s.t)});for(const p of[x.bp,x.ap])await fetch(`${SBU}/storage/v1/object/realisations/${p}`,{method:'DELETE',headers:sbH(s.t)});await loadGal();draw()}catch(e){alert(e)}}

function avisPage(){const a=avPub();$('#app').innerHTML=`<h2>Avis de nos clients</h2>${avgHtml()}<div class="card box" style="margin:0 0 16px"><b>Laisser un avis</b><input id=an placeholder="Votre prénom" maxlength=40><select id=ar>${[5,4,3,2,1].map(n=>`<option value=${n}>${n} sur 5</option>`).join('')}</select><textarea id=ac rows=3 maxlength=600 placeholder="Votre expérience"></textarea><button onclick="avSend()">Envoyer mon avis</button><p class="t">Votre avis sera publié après validation.</p></div><div class="grid">${a.map(x=>avCard(x)).join('')||'<p class="t">Aucun avis publié pour le moment.</p>'}</div>`}
async function avSend(){try{const n=$('#an').value.trim(),c=$('#ac').value.trim();if(n.length<2||c.length<5)throw 'Indiquez votre prénom et un commentaire (5 caractères minimum)';const r=await fetch(`${SBU}/rest/v1/avis`,{method:'POST',headers:sbH(null,{'content-type':'application/json',Prefer:'return=minimal'}),body:JSON.stringify({name:n,rating:+$('#ar').value,comment:c})});if(!r.ok)throw 'Envoi impossible ('+r.status+')';$('#an').value='';$('#ac').value='';alert('Merci ! Votre avis sera publié après validation.')}catch(e){alert(e)}}
async function avOk(id){await sbEnsure();const s=sbSess();if(!s)return;await fetch(`${SBU}/rest/v1/avis?id=eq.${id}`,{method:'PATCH',headers:sbH(s.t,{'content-type':'application/json'}),body:JSON.stringify({approved:true})});await loadAv();draw()}
